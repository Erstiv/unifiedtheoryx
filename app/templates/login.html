{% extends "base.html" %}
{% block title %}Login — The Grand Unified Theory of X{% endblock %}
{% block content %}
<div class="login-container">
    <div class="form-card" style="max-width: 400px; margin: 4rem auto;">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Admin Login</h2>
        {% if error %}
        <div class="alert" style="background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; margin-bottom: 1rem;">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
